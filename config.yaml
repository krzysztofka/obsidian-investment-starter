# Configuration for Asset Portfolio Management

# Parallel processing & concurrency settings
concurrency:
  # Max worker threads for asset enrichment, currency updates, and ETF holding sync.
  # 'auto' automatically detects and uses the number of CPU hardware threads (os.cpu_count()).
  max_workers: "auto"

# Resilience, rate limiting & retry policy settings
resilience:
  # Maximum number of retry attempts for failed network/API requests
  max_retries: 3
  # Initial backoff delay in seconds
  base_delay_seconds: 0.5
  # Maximum backoff delay ceiling in seconds
  max_delay_seconds: 10.0
  # Enable randomized jitter to prevent thundering herd problem
  jitter: true
  # Provider-specific rate limits (requests per second per domain)
  rate_limits:
    finnhub.io: 10.0
    query1.finance.yahoo.com: 15.0
    query2.finance.yahoo.com: 15.0
    justetf.com: 5.0
    stooq.com: 8.0
    stooq.pl: 8.0
    ishares.com: 6.0
    vanguard.com: 6.0
    vanguard.co.uk: 6.0
    vaneck.com: 6.0
    api.nbp.pl: 10.0

# Platform Extensions Configuration
platforms:
  pko_bp_bonds:
    enabled: true
    default_mode: "xls"
    default_portfolio: "Long term"
    rules:
      # Family & inflation-protected bonds up to 90k PLN to Safety net
      - prefix: "ROD"
        portfolio: "Safety net"
        max_amount: 90000
      - prefix: "ROK"
        portfolio: "Safety net"
        max_amount: 90000
      # Liquidity cushions
      - prefix: "OTS"
        portfolio: "Safety net"
      - prefix: "ROR"
        portfolio: "Safety net"

  mbank_ike:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Long term"

  mbank_ikze:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Long term"

  degiro:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Aggressive"

  exante:
    enabled: true
    default_mode: "csv" # or "api"


alerts:
  overvalued:
    enabled: true
    # Maximum acceptable trailing P/E ratio before triggering #alert/overvalued
    max_pe_ratio: 40.0

  delisting_risk:
    enabled: true
    # Minimum AUM (fund size) in millions (EUR/USD) below which an ETF is flagged with #alert/delisting_risk
    min_aum_million: 50.0

  allocation_drift:
    enabled: true
    # Maximum percentage of total portfolio value a single equity position should not exceed
    max_portfolio_weight_pct: 15.0

  stop_loss:
    enabled: true
    # Triggers #alert/stop_loss if an asset's current_price is <= stop_loss defined in note frontmatter

  insider_selling:
    enabled: true
    # Lookback window in days for net insider transactions via Finnhub
    lookback_days: 90

  macro_yield_curve:
    enabled: true
    # Triggers #alert/macro_inverted_yield_curve on equities and cyclical assets when US 10Y-2Y spread is inverted (< 0 bps)
    inversion_threshold_bps: 0.0

etf:
  # Default number of top underlying holdings to extract and maintain per ETF
  max_top_holdings: 10

  issuer:
    # Keyword-to-issuer mapping for automatic issuer discovery from asset names
    discovery_mapping:
      ishares: "iShares"
      vanguard: "Vanguard"
      vngrd: "Vanguard"
      vaneck: "VanEck"
      spdr: "SPDR"
      "state street": "SPDR"
      invesco: "Invesco"
      xtrackers: "Xtrackers"
      "x-trackers": "Xtrackers"
      dws: "Xtrackers"
      amundi: "Amundi"
      lyxor: "Amundi"
      hsbc: "HSBC"
      wisdomtree: "WisdomTree"
      "global x": "Global X"
      globalx: "Global X"
      schwab: "Schwab"
      "first trust": "First Trust"
      "beta etf": "Beta ETF"
      franklin: "Franklin Templeton"
      jpmorgan: "JPMorgan"
      "jpm ": "JPMorgan"


dominant_sector:
