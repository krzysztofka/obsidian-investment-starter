# Configuration for Asset Portfolio Management

# Parallel processing & concurrency settings
concurrency:
  # Max worker threads for asset enrichment, currency updates, and ETF holding sync.
  # 'auto' automatically detects and uses the number of CPU hardware threads (os.cpu_count()).
  max_workers: "auto"

# Resilience, rate limiting & retry policy settings
resilience:
  # Maximum number of retry attempts for failed network/API requests
  max_retries: 3
  # Initial backoff delay in seconds
  base_delay_seconds: 0.5
  # Maximum backoff delay ceiling in seconds
  max_delay_seconds: 10.0
  # Enable randomized jitter to prevent thundering herd problem
  jitter: true
  # Provider-specific rate limits (requests per second per domain)
  rate_limits:
    finnhub.io: 10.0
    query1.finance.yahoo.com: 15.0
    query2.finance.yahoo.com: 15.0
    justetf.com: 5.0
    stooq.com: 8.0
    stooq.pl: 8.0
    ishares.com: 6.0
    vanguard.com: 6.0
    vanguard.co.uk: 6.0
    vaneck.com: 6.0
    api.nbp.pl: 10.0

# Localization & Base Currency Configuration
localization:
  # Base portfolio reference currency (ISO-4217 code)
  base_currency: "PLN"
  # Display symbol for base currency (e.g. "zł", "€", "$", "£")
  currency_symbol: "zł"
  # Position of symbol relative to value: "prefix" ($100) or "suffix" (100 zł)
  symbol_position: "suffix"
  # Suggested currencies for quick selection in CLI prompts
  supported_currencies:
    - "PLN"
    - "EUR"
    - "USD"
    - "GBP"
    - "CHF"

# Platform Extensions Configuration
platforms:
  pko_bp_bonds:
    enabled: true
    default_mode: "xls"
    default_portfolio: "Long term"
    rules:
      # Family & inflation-protected bonds up to 90k PLN to Safety net
      - prefix: "ROD"
        portfolio: "Safety net"
        max_amount: 90000
      - prefix: "ROK"
        portfolio: "Safety net"
        max_amount: 90000
      # Liquidity cushions
      - prefix: "OTS"
        portfolio: "Safety net"
      - prefix: "ROR"
        portfolio: "Safety net"

  mbank_ike:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Long term"

  mbank_ikze:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Long term"

  degiro:
    enabled: true
    default_mode: "csv"
    default_portfolio: "Aggressive"

  exante:
    enabled: true
    default_mode: "csv" # or "api"


alerts:
  overvalued:
    enabled: true
    # Maximum acceptable trailing P/E ratio before triggering #alert/overvalued
    max_pe_ratio: 40.0

  delisting_risk:
    enabled: true
    # Minimum AUM (fund size) in millions (EUR/USD) below which an ETF is flagged with #alert/delisting_risk
    min_aum_million: 50.0

  allocation_drift:
    enabled: true
    # Maximum percentage of total portfolio value a single equity position should not exceed
    max_portfolio_weight_pct: 15.0

  stop_loss:
    enabled: true
    # Triggers #alert/stop_loss if an asset's current_price is <= stop_loss defined in note frontmatter

  insider_selling:
    enabled: true
    # Lookback window in days for net insider transactions via Finnhub
    lookback_days: 90

  macro_yield_curve:
    enabled: true
    # Triggers #alert/macro_inverted_yield_curve on equities and cyclical assets when US 10Y-2Y spread is inverted (< 0 bps)
    inversion_threshold_bps: 0.0

etf:
  # Default number of top underlying holdings to extract and maintain per ETF
  max_top_holdings: 10
  # Note: Standard ETF issuers (iShares, Vanguard, VanEck, SPDR, Invesco, etc.) are built-in defaults.
  # Add custom issuer keyword overrides here if needed:
  # issuer:
  #   discovery_mapping:
  #     custom_keyword: "Custom Issuer"

dominant_sector:
  # Default percentage threshold (50%) for a sector to be considered dominant
  default_threshold: 50.0
  # Label used when no sector exceeds its designated threshold
  diversified_label: "Diversified"
  # Note: Standard sector thresholds and raw-to-normalized mappings are built-in system defaults.
  # Add custom threshold or mapping overrides here if needed:
  # thresholds:
  #   Healthcare: 80.0
  # mappings:
  #   "custom_sector": "Normalized Sector"


# Data Retention & History Archival Settings
retention:
  # Historical portfolio timeline retention & archival
  history:
    enabled: true
    # Maximum days of daily records to retain in 10_Finance/History/portfolio.csv (default 730 = 2 years)
    retention_days: 730
    # Directory to store partitioned annual archives (history-archive-YYYY.csv)
    archive_dir: "10_Finance/History/archive"
    # Ensure baseline snapshot is preserved at the cutoff boundary to prevent holding drops
    preserve_boundary_baseline: true

  # Ephemeral raw broker export files rotation (00_Raw/)
  raw_data:
    enabled: true
    # Retention period in days for raw broker exports (default 365 = 1 year)
    retention_days: 365
    # Action for expired files: "archive" (move to archive_dir) or "prune" (permanently delete)
    action: "archive"
    # Destination directory when action is "archive"
    archive_dir: "00_Raw/archive"
    # Optional ZIP compression toggle
    compress_zip: false
    # Patterns and directories excluded from rotation (case-insensitive glob)
    exclude_patterns:
      - "sample_*"
      - ".*"
      - ".gitkeep"
      - "Articles/*"
      - "archive/*"

# Model Portfolios & Rebalancing Configuration
model_portfolios:
  safety_net:
    name: "Safety net"
    rebalance_strategy: "inflow_first" # "inflow_first" (cash-flow DCA) or "full_rebalance"
    tolerance_band_pct: 5.0 # Drift corridor in percentage points (±5.0%)
    min_trade_amount: 500.0 # Ignore rebalance actions smaller than this amount
    primary_layer: "asset_classes"
    layers:
      asset_classes:
        - target: "Bonds"
          weight_pct: 80.0
        - target: "Cash"
          weight_pct: 20.0
      # Optional holding layer can be configured, e.g.:
      # assets:
      #   - target: "EDO0936"
      #     weight_pct: 60.0
      #   - target: "OTS0127"
      #     weight_pct: 20.0
      #   - target: "Cash"
      #     weight_pct: 20.0

  long_term:
    name: "Long term"
    rebalance_strategy: "inflow_first"
    tolerance_band_pct: 5.0
    min_trade_amount: 1000.0
    primary_layer: "asset_classes"
    layers:
      asset_classes:
        - target: "Equities"
          weight_pct: 80.0
        - target: "Bonds"
          weight_pct: 20.0
      # Optional holding layer can be configured, e.g.:
      # assets:
      #   - target: "VWCE"
      #     weight_pct: 60.0
      #   - target: "V80A"
      #     weight_pct: 20.0
      #   - target: "Physical Gold"
      #     weight_pct: 20.0

  aggressive:
    name: "Aggressive"
    rebalance_strategy: "inflow_first"
    tolerance_band_pct: 5.0
    min_trade_amount: 500.0
    primary_layer: "asset_classes"
    layers:
      asset_classes:
        - target: "Equities"
          weight_pct: 90.0
        - target: "Cash"
          weight_pct: 10.0
      # Optional sector layer can be configured, e.g.:
      # sectors:
      #   - target: "Technology"
      #     weight_pct: 50.0
      #   - target: "Military"
      #     weight_pct: 30.0
      #   - target: "Cash"
      #     weight_pct: 20.0

# Investor Profile & AI Rebalancing Rules of Engagement
user_profile:
  # Overall risk tolerance: "conservative", "moderate", or "aggressive"
  risk_tolerance: "moderate"

  # Maximum allocation percentage allowed for any single equity position
  max_single_stock_pct: 15.0

  # Prioritize cash-flow DCA over taxable sales to minimize capital gains tax drag (e.g. 19% Belka tax)
  tax_sensitive: true

  # Allow AI advisor to propose moving trimmed profits from Aggressive to Long Term foundation (Strategic De-risking)
  allow_profit_harvesting: true

  # Tax-advantaged brokers prioritized for tax-free growth (filling annual contribution limits first)
  tax_advantaged_priority:
    - "mbank_ike"
    - "mbank_ikze"

