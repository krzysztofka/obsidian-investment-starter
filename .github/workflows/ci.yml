name: CI
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate CLI Help Commands
        run: |
          python run.py --help
          python 99_System/Scripts/run.py --help
          python 99_System/Scripts/import_assets.py --help
          python 99_System/Scripts/alerts/engine.py --help
          python 99_System/Scripts/sync_macro.py --help
          python 99_System/Scripts/sync_etf_holdings.py --help

      - name: Validate Dry-Run Execution
        run: |
          python run.py --alerts --dry-run
          python run.py --macro --dry-run
          python run.py --sync-etfs --dry-run

      - name: Run Automated Unit Tests
        run: |
          python -m pytest
