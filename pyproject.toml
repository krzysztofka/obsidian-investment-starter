[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-investment-starter"
version = "0.6.0"
description = "Investment Second Brain & Portfolio Management System powered by Obsidian, Dataview, and Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Krzysztof" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "finnhub-python>=2.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "yfinance>=0.2.30",
    "jinja2>=3.1.0",
    "openbb>=4.0.0; python_version < '3.13'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/krzysztofka/obsidian-investment-starter"
Repository = "https://github.com/krzysztofka/obsidian-investment-starter.git"

[tool.pytest.ini_options]
testpaths = ["99_System/Tests"]
pythonpath = ["99_System/Scripts", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "E402", # module level import not at top of file (used for sys.path manipulation)
    "W291", # trailing whitespace (intentional in markdown templates)
    "W293", # blank line contains whitespace (intentional in markdown templates)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
mypy_path = ["99_System/Scripts", "."]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true

