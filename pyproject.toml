[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-investment-starter"
version = "0.6.0"
description = "Investment Second Brain & Portfolio Management System powered by Obsidian, Dataview, and Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Krzysztof" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "finnhub-python>=2.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "yfinance>=0.2.30",
    "openbb>=4.0.0; python_version < '3.13'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/krzysztofka/obsidian-investment-starter"
Repository = "https://github.com/krzysztofka/obsidian-investment-starter.git"
